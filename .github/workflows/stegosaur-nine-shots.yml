name: Stegosaur workflow checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stegosaur-nine-shots.yml"
      - "workflows/stegosaur-nine-shots/**"
  pull_request:
    paths:
      - ".github/workflows/stegosaur-nine-shots.yml"
      - "workflows/stegosaur-nine-shots/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check shared timeline and render reports
        run: python3 -m unittest discover -s workflows/stegosaur-nine-shots -v
      - name: Check Three.js script syntax
        shell: bash
        run: |
          for script in workflows/stegosaur-nine-shots/project/Web/*.{js,mjs}; do
            node --check "$script"
          done
